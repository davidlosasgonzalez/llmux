# LLMux Council configuration — copy to ~/.llmux/council.yaml
# Every value is optional; delete a key to use its built-in default.
# The default regime is strictly free-only. Do NOT set ALLOW_PAID_MODELS unless
# you explicitly accept possible charges (it is an env var, not a file key).

depth: deep # quick | standard | deep
max_rounds: 3 # hard ceiling, 1..5
quality_threshold: 0.85 # stop refining once the critique score reaches this
convergence_threshold: 0.98 # stop once a synthesis repeats the previous answer
parallel_proposals: true
privacy: redacted # public | redacted | local_only

# Selection order preference. Providers still pass the free-only cost gate.
provider_priority:
  - groq
  - nvidia_nim
  - cerebras
  - gemini
  - mistral
  - open_router
  - github_models
  - cloudflare
  - cohere

# Turn providers on/off. Adding a paid (card-required) provider here does NOT
# let it be used in free-only mode; the cost gate still excludes it. Enable a
# Tier-B/disabled provider only after confirming it is free without a card.
enabled_providers:
  - groq
  - nvidia_nim
  - cerebras
  - gemini

minimum_models: 3
maximum_models: 5
minimum_distinct_providers: 3
max_tokens_per_call: 2048

# Hard wall-clock ceiling for any single model call (seconds). A model that
# exceeds it is treated as a provider failure so one slow model cannot stall the
# whole deliberation.
call_timeout_s: 90

# Web research (Phase 2.5). When enabled and the prompt hinges on current facts
# (versions, limits, prices, docs), the local process searches and fetches
# sources before the panel proposes. Disabled under local_only privacy.
research_enabled: true
research_max_sources: 4
research_tokens_per_source: 2000 # per-source budget (≈4 chars/token)
research_tokens_total: 6000 # global budget across all sources
research_fetch_timeout_s: 15

# Optional: capability preferences per task category (advisory).
roles:
  software_engineering:
    proposer_capabilities: [coding, reasoning]
    critic_capabilities: [reasoning]
    synthesis_capabilities: [coding, long_context]
  architecture:
    proposer_capabilities: [reasoning, long_context]
    critic_capabilities: [reasoning]
    synthesis_capabilities: [reasoning, structured_output]
